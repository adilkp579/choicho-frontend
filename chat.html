<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Chat · Choicho</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="CSS/main.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    .page {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      position: relative;
    }
    
    .scrollable-content {
      width: 100%;
      max-width: 100%;
      padding-bottom: 80px;
    }
    
    .chat-header {
      display: none;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1rem;
      background: #000;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      width: 100%;
    }
    .chat-header.show { display: flex; }
    .chat-back {
      width: 2.4rem;
      height: 2.4rem;
      background: #1a1a1a;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chat-partner-info {
      flex: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chat-partner-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .chat-partner-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .chat-partner-details {
      flex: 1;
      min-width: 0;
    }
    .chat-partner-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .chat-partner-status {
      font-size: 0.65rem;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .chat-partner-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }
    .call-btns {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .call-btn {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .call-btn:active { transform: scale(0.95); }
    .call-btn.in-call {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .chat-settings-btn {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chat-settings-btn:active { transform: scale(0.95); }
    
    .search-bar-container {
      padding: 0.3rem 1rem 0.4rem;
      background: #000;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      width: 100vw;
      max-width: 100vw;
      margin-left: 0;
      margin-right: 0;
      box-sizing: border-box;
      display: block;
      position: relative;
      left: 0;
      right: 0;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: #111;
      border-radius: 2rem;
      padding: 0.2rem 0.8rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: border 0.25s, background 0.25s;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      min-height: 36px;
    }
    .search-bar:focus-within {
      border-color: #FFFC00;
      background: #0a0a0a;
      box-shadow: 0 0 0 3px rgba(255,252,0,0.08);
    }
    .search-bar i {
      color: #666;
      margin-right: 0.5rem;
      font-size: 0.75rem;
      transition: color 0.25s;
      flex-shrink: 0;
    }
    .search-bar:focus-within i {
      color: #FFFC00;
    }
    .search-bar input {
      background: transparent;
      border: none;
      color: #fff;
      padding: 0.3rem 0;
      width: 100%;
      min-width: 0;
      font-size: 0.75rem;
      outline: none;
      font-weight: 400;
      letter-spacing: 0.2px;
      box-sizing: border-box;
    }
    .search-bar input::placeholder {
      color: #555;
      font-weight: 300;
      letter-spacing: 0.2px;
      font-size: 0.75rem;
    }
    .search-bar input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }
    
    .chat-list-full {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      width: 100%;
    }
    .chat-list-full.hidden { display: none; }
    .chat-list-header {
      padding: 0.5rem 1rem;
      font-size: 0.6rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .user-list-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      transition: background 0.2s;
      width: 100%;
    }
    .user-list-item:active { background: rgba(255,255,255,0.03); }
    .user-list-item.active { background: rgba(255,252,0,0.06); }
    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 1.1rem;
      color: #fff;
    }
    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .user-info {
      flex: 1;
      min-width: 0;
    }
    .user-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-name {
      font-size: 0.85rem;
      color: #fff;
      font-weight: 500;
    }
    .user-time {
      font-size: 0.6rem;
      color: #555;
    }
    .user-msg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }
    .user-last-msg {
      font-size: 0.7rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .user-last-msg.unread-msg {
      color: #fff;
      font-weight: 500;
    }
    .unread-count {
      background: #FFFC00;
      color: #000;
      font-size: 0.6rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .chat-view {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .chat-view.show { display: flex; }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      background: #000;
      width: 100%;
    }
    .messages-container::-webkit-scrollbar { width: 0; }
    .message-wrapper {
      display: flex;
      max-width: 85%;
      animation: fadeInUp 0.25s;
    }
    .message-wrapper.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-wrapper.received {
      align-self: flex-start;
    }
    .message-bubble {
      padding: 0.55rem 0.8rem;
      border-radius: 1.2rem;
      font-size: 0.85rem;
      line-height: 1.3;
      word-break: break-word;
    }
    .sent .message-bubble {
      background: #FFFC00;
      color: #000;
      border-bottom-right-radius: 0.3rem;
    }
    .received .message-bubble {
      background: #111;
      color: #fff;
      border-bottom-left-radius: 0.3rem;
    }
    .message-time {
      font-size: 0.55rem;
      margin-top: 0.1rem;
    }
    .sent .message-time {
      text-align: right;
      color: rgba(0,0,0,0.45);
    }
    .received .message-time {
      color: rgba(255,255,255,0.35);
    }
    .message-image {
      max-width: 200px;
      max-height: 200px;
      border-radius: 0.8rem;
      cursor: pointer;
    }
    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 0.8rem;
    }
    .chat-input-area {
      display: none;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.8rem;
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0.5rem));
      background: #000;
      border-top: 1px solid rgba(255,255,255,0.06);
      width: 100%;
    }
    .chat-input-area.show { display: flex; }
    .camera-btn-s, .mic-btn-s {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0a0a0a;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      min-width: 0;
    }
    .chat-input:focus { border-color: #FFFC00; }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFFC00;
      border: none;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fab-container {
      position: fixed;
      bottom: 85px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .fab-main {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FFFC00;
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,252,0,0.3);
      transition: all 0.3s ease;
      position: relative;
    }
    .fab-main:active {
      transform: scale(0.9);
    }
    .fab-main .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: #fff;
      font-size: 0.5rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
    }
    
    .fab-main i {
      font-size: 0.9rem !important;
    }
    
    /* Call Overlay */
    .call-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
    }
    .call-overlay.show {
      display: flex;
    }
    .call-overlay .call-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #fff;
      margin-bottom: 1.5rem;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .call-overlay .call-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .call-overlay .call-name {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .call-overlay .call-status {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .call-overlay .call-timer {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 2rem;
      font-variant-numeric: tabular-nums;
    }
    .call-overlay .call-actions {
      display: flex;
      gap: 2rem;
    }
    .call-overlay .call-action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .call-overlay .call-action-btn:active {
      transform: scale(0.9);
    }
    .call-overlay .call-action-btn.end-call {
      background: #ef4444;
      color: #fff;
    }
    .call-overlay .call-action-btn.end-call:hover {
      background: #dc2626;
    }
    .call-overlay .call-action-btn.mute-call {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .call-overlay .call-action-btn.mute-call:hover {
      background: rgba(255,255,255,0.2);
    }
    .call-overlay .call-action-btn.mute-call.muted {
      background: #ef4444;
      color: #fff;
    }
    
    .new-chat-panel {
      position: fixed;
      bottom: 150px;
      right: 20px;
      width: 350px;
      max-width: calc(100vw - 40px);
      max-height: 60vh;
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(40px) saturate(1.8) !important;
      -webkit-backdrop-filter: blur(40px) saturate(1.8) !important;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 101;
    }
    .new-chat-panel.show {
      display: flex;
      animation: slideUp 0.3s ease;
    }
    
    .new-chat-panel-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
    }
    .new-chat-panel-header h3 {
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .new-chat-panel-close {
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 1.2rem;
      transition: color 0.2s;
      background: none;
      border: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .new-chat-panel-close:hover { color: #fff; }
    
    .new-chat-panel-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255, 255, 255, 0.02);
    }
    .new-chat-panel-tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .new-chat-panel-tab.active {
      color: #fff;
      border-bottom-color: #FFFC00;
    }
    .new-chat-panel-tab .tab-badge {
      background: #ef4444;
      color: #fff;
      font-size: 0.5rem;
      border-radius: 10px;
      padding: 0.05rem 0.4rem;
      margin-left: 0.3rem;
    }
    
    .new-chat-panel-search {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255, 255, 255, 0.02);
    }
    .new-chat-panel-search input {
      width: 100%;
      padding: 0.4rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.75rem;
      outline: none;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }
    .new-chat-panel-search input:focus {
      border-color: #FFFC00;
      background: rgba(255, 255, 255, 0.1);
    }
    .new-chat-panel-search input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    
    .new-chat-panel-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.3rem 0;
      background: rgba(255, 255, 255, 0.02);
    }
    .new-chat-panel-list::-webkit-scrollbar {
      width: 3px;
    }
    .new-chat-panel-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }
    .new-chat-panel-list::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .new-chat-panel-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 1rem;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .new-chat-panel-item:active {
      background: rgba(255, 255, 255, 0.08);
    }
    .new-chat-panel-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .new-chat-panel-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .new-chat-panel-info {
      flex: 1;
      min-width: 0;
    }
    .new-chat-panel-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .new-chat-panel-sub {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .new-chat-panel-action {
      padding: 0.25rem 0.8rem;
      border-radius: 1.5rem;
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,252,0,0.15);
      border: 1px solid rgba(255,252,0,0.3);
      color: #FFFC00;
      transition: all 0.2s;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }
    .new-chat-panel-action:active {
      transform: scale(0.95);
    }
    .new-chat-panel-action.accept {
      background: rgba(74,222,128,0.15);
      border-color: rgba(74,222,128,0.3);
      color: #4ade80;
    }
    .new-chat-panel-action.decline {
      background: rgba(239,68,68,0.15);
      border-color: rgba(239,68,68,0.3);
      color: #ef4444;
    }
    .new-chat-panel-action.request-sent {
      background: rgba(245,158,11,0.15);
      border-color: rgba(245,158,11,0.3);
      color: #f59e0b;
      cursor: default;
    }
    .new-chat-panel-action.request-btn {
      background: rgba(255,252,0,0.15);
      border-color: rgba(255,252,0,0.3);
      color: #FFFC00;
    }
    .new-chat-panel-action.chat-btn {
      background: rgba(74,222,128,0.15);
      border-color: rgba(74,222,128,0.3);
      color: #4ade80;
    }
    .new-chat-panel-empty {
      text-align: center;
      padding: 2rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .panel-loading {
      text-align: center;
      padding: 1rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .panel-loading i {
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 0.5rem;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .chat-settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 600;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .chat-settings-overlay.show { display: flex; }
    .chat-settings-modal {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(40px) saturate(1.8);
      -webkit-backdrop-filter: blur(40px) saturate(1.8);
      border-radius: 1.5rem;

      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.1);

    .chat-settings-header {
      padding: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);

    .chat-settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .chat-settings-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: background 0.2s;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.05);

    .chat-settings-item:active {
      background: rgba(255,255,255,0.05);

    .chat-settings-item i {
      width: 24px;
      color: rgba(255,255,255,0.5);
      font-size: 1rem;
    }
    .chat-settings-item .item-text {
      flex: 1;
      font-size: 0.85rem;

    .chat-settings-item .item-sub {

    }
    .chat-settings-item.danger {
      color: #ef4444;
    }
    .chat-settings-item.danger i {
      color: #ef4444;
    }
    
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.8rem;

      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
    
    /* Voice Recording Bar */
    .recording-bar {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: #0a0a0a;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      width: 100%;
    }
    .recording-bar.show { display: flex; }
    .recording-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      animation: recPulse 0.8s infinite;
    }
    @keyframes recPulse {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.4;transform:scale(0.7)}
    }
    .recording-time-text {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .recording-cancel {
      margin-left: auto;
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .recording-send {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFFC00;
      border: none;
      color: #000;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

    .typing-bubble {

    .typing-bubble .tb-dot {
      width: 5px;

    .typing-bubble .tb-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%{transform:translateY(0);opacity:0.4}
      100%{transform:translateY(-4px);opacity:1}
    }
    
    /* Voice message styles */
    .voice-msg {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      min-width: 180px;

    .voice-play-btn {

    }
    .sent .voice-wave-bar { background: #000; }
    .received .voice-wave-bar { background: #fff; }
    .voice-duration {
      font-size: 0.55rem;
      opacity: 0.7;

      text-align: right;
    }
    
    @media (min-width: 1024px) {
      .scrollable-content { 
        padding-left: 5.5rem;

        max-width: 100%;
      }
      .chat-list-full, .chat-view {

        transition: opacity 0.2s;

      }

    .search-bar-container,
    .search-bar,

    .chat-view.show ~ .fab-container {

    }
    .chat-view.show ~ .new-chat-panel {

    }
  </style>
</head>
<body>
  <div class="page">

            <div class="tb-dot"></div>

        </div>
        <div class="recording-bar" id="recordingBar">
          <div class="recording-dot"></div>

    <!-- New Chat Panel -->

        <button class="new-chat-panel-close" onclick="closeNewChatPanel()">✕</button>
      </div>
      <div class="new-chat-panel-tabs">
        <div class="new-chat-panel-tab active" data-tab="users" onclick="switchPanelTab('users')">
          <i class="fas fa-users"></i> Users
        </div>
        <div class="new-chat-panel-tab" data-tab="requests" onclick="switchPanelTab('requests')">

    <!-- Chat Settings Modal -->

  <script type="module">
    // ===== FIREBASE IMPORTS =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
      serverTimestamp, doc, setDoc, getDoc, getDocs, updateDoc, 
      increment, deleteDoc, arrayUnion, where, limit, startAfter 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    
    // ===== FIREBASE CONFIG =====
    const firebaseConfig = {
      apiKey: "AIzaSyC2JA1K-fvsPUkWUfvSFhkC-ET8dpPOr0M",
      authDomain: "mychat-a97bf.firebaseapp.com",
      projectId: "mychat-a97bf"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    // ===== AUTH =====
    let currentUser = null;
    let currentUserId = null;
    
    function initializeWithLocalUser() {
      const fallbackUid = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      currentUserId = fallbackUid;
      currentUser = {
        uid: fallbackUid,
        displayName: `@user_${fallbackUid.substring(0, 6)}`,
        isAnonymous: true
      };
      localStorage.setItem('uid', currentUserId);
      localStorage.setItem('currentUser', currentUser.displayName);
      console.log('✅ Local user initialized');
      initApp();
    }
    
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        currentUser = user;
        localStorage.setItem('uid', currentUserId);
        try {
          const userRef = doc(db, 'users', currentUserId);
          const userDoc = await getDoc(userRef);
          if (!userDoc.exists()) {
            await setDoc(userRef, {
              username: currentUser.displayName || `@user_${currentUserId.substring(0, 6)}`,
              createdAt: serverTimestamp()
            });
          }
        } catch(e) {}
        console.log('✅ Firebase user authenticated');
        initApp();
      } else {
        try {
          const cred = await signInAnonymously(auth);
        } catch(error) {
          console.warn('Anonymous auth failed:', error.message);
          initializeWithLocalUser();
        }
      }
    });
    
    setTimeout(() => {
      if (!currentUserId) {
        initializeWithLocalUser();
      }
    }, 100);
    
    // ===== STATE VARIABLES =====
    let chatPartner = null;
    let chatId = null;
    let unsubMessages = null;
    let unsubChatList = null;
    let allUsers = [];
    let pendingRequests = [];
    let sentRequests = [];
    let acceptedUsers = [];
    let chatListData = [];
    let isPanelOpen = false;
    let isMuted = false;
    let isCallActive = false;
    let callType = null;
    let callTimerInterval = null;
    let callSeconds = 0;
    let isMutedCall = false;
    let localStream = null;
    let peerConnection = null;
    let iceServers = [];
    let activePanelTab = 'users';
    let lastVisible = null;
    let isLoadingUsers = false;
    let allUsersLoaded = false;
    const PAGE_SIZE = 50;
    
    // Voice recording
    let mediaRecorder = null;
    let audioChunks = [];
    let voiceTimer = null;
    let voiceSeconds = 0;
    let isRecording = false;
    
    // ===== UTILITY FUNCTIONS =====
    function cleanUsername(username) {
      return (username || '').replace(/^@/, '');
    }
    
    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    
    function timeAgo(date) {
      if (!date) return '';
      const now = new Date();
      const diff = now - date;
      if (diff < 60000) return 'Now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
      if (diff < 604800000) return Math.floor(diff / 86400000) + 'd';
      return date.toLocaleDateString();
    }
    
    function getAvatarHTML(username) {
      const clean = cleanUsername(username);
      return `<span style="font-weight:700;font-size:1.2rem;">${clean.charAt(0).toUpperCase()}</span>`;
    }
    
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
    
    function scrollToBottom() {
      const container = document.getElementById('messagesContainer');
      setTimeout(() => {
        if (container) container.scrollTop = container.scrollHeight;
      }, 100);
    }
    
    // ===== ICE SERVERS FOR CALLS =====
    const PROPER_ICE_SERVERS = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" },
      { urls: "stun:stun3.l.google.com:19302" },
      { urls: "stun:stun4.l.google.com:19302" },
      { urls: "stun:stun.stunprotocol.org:3478" }
    ];
    
    // ===== INIT APP =====
    function initApp() {
      loadChats();
      loadRequests();
      loadUsers();
    }
    
    // ===== LOAD CHATS =====
    function loadChats() {
      if (unsubChatList) unsubChatList();
      const q = query(collection(db, 'chats'), orderBy('lastTime', 'desc'));
      unsubChatList = onSnapshot(q, (snapshot) => {
        const chats = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          const ids = doc.id.split('_');
          if (ids.includes(currentUserId)) {
            const partnerId = ids.find(i => i !== currentUserId);
            if (partnerId && data.lastMessage !== undefined) {
              chats.push({
                partnerId: '@' + partnerId,
                lastMsg: data.lastMessage || 'No messages',
                lastTime: data.lastTime?.toDate() || new Date(),
                unread: data[`unread_${currentUserId}`] || 0
              });
            }
          }
        });
        chatListData = chats;
        renderChatList(chats);
        document.getElementById('chatCount').textContent = chats.length ? `(${chats.length})` : '';
        applySearchFilter();
      });
    }
    
    function renderChatList(chats) {
      const container = document.getElementById('chatList');
      if (!chats.length) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-comment-slash"></i><p>No messages yet</p><p style="font-size:0.65rem;margin-top:0.5rem;">Tap + to start a chat</p></div>';
        return;
      }
      container.innerHTML = chats.map(c => `
        <div class="user-list-item ${chatPartner === c.partnerId ? 'active' : ''}" data-partner="${c.partnerId}" onclick="openChat('${c.partnerId}')">
          <div class="user-avatar" onclick="event.stopPropagation();window.location.href='profile.html?user=${encodeURIComponent(c.partnerId)}'">
            ${getAvatarHTML(c.partnerId)}
          </div>
          <div class="user-info">
            <div class="user-name-row">
              <span class="user-name">${cleanUsername(c.partnerId)}</span>
              <span class="user-time">${timeAgo(c.lastTime)}</span>
            </div>
            <div class="user-msg-row">

    // ===== SEARCH FILTER =====
    window.filterChats = function() {

    function applySearchFilter() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const items = document.querySelectorAll('#chatList .user-list-item');
      
      if (!search) {
        items.forEach(item => item.style.display = 'flex');
        return;
      }
      
      items.forEach(item => {

        const name = nameEl ? nameEl.textContent.toLowerCase() : '';
        const msgEl = item.querySelector('.user-last-msg');
        const msg = msgEl ? msgEl.textContent.toLowerCase() : '';

    // ===== CHECK IF USER CAN CHAT =====
    function canChatWithUser(username) {
      const partnerId = username.replace('@', '');
      return acceptedUsers.some(u => u === partnerId || u === username);

    // ===== OPEN CHAT =====
    window.openChat = async function(partner) {
      const partnerId = partner.replace('@', '');
      
      // Check if chat is allowed
      if (!canChatWithUser(partnerId) && !acceptedUsers.includes(partnerId)) {
        const isPending = pendingRequests.some(r => r.from === partner) || sentRequests.some(r => r.to === partner);
        if (isPending) {
          showToast('⏳ Request pending. Wait for approval.');
        } else {
          showToast('❌ Send a request first to start chatting.');
        }
        return;
      }
      
      chatPartner = partner;
      chatId = [currentUserId, partnerId].sort().join('_');
      
      await updateDoc(doc(db, 'chats', chatId), { [`unread_${currentUserId}`]: 0 }).catch(() => {});
      
      document.getElementById('topIcons').style.display = 'none';
      document.getElementById('chatHeader').classList.add('show');
      document.getElementById('chatListFull').classList.add('hidden');
      document.getElementById('searchBarContainer').classList.add('hidden');
      document.getElementById('chatView').classList.add('show');
      document.getElementById('chatInputArea').classList.add('show');
      document.getElementById('floatingNav').style.display = 'none';
      document.getElementById('partnerName').textContent = cleanUsername(partner);
      
      document.getElementById('fabContainer').style.display = 'none';
      closeNewChatPanel();
      
      const avatarContainer = document.getElementById('partnerAvatar');
      avatarContainer.innerHTML = getAvatarHTML(partner);
      
      if (unsubMessages) unsubMessages();
      
      const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'));
      unsubMessages = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messagesContainer');
        const emptyChat = document.getElementById('emptyChat');
        
        if (snapshot.empty) {
          container.innerHTML = '<div class="empty-chat" id="emptyChat">Send a message to start chatting!</div>';
          return;
        }
        
        // Remove empty chat message if exists
        const ec = document.getElementById('emptyChat');
        if (ec) ec.remove();
        
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            const msg = change.doc.data();
            const msgId = change.doc.id;
            if (document.getElementById('msg-' + msgId)) return;
            renderMessage(msgId, msg);
          }
        });
        scrollToBottom();
      });
      
      // Listen for typing
      listenToTyping();
    };
    
    function renderMessage(id, msg) {
      const container = document.getElementById('messagesContainer');
      const isSent = msg.sender === currentUserId;
      const tb = document.getElementById('typingBubble');
      
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${isSent ? 'sent' : 'received'}`;
      wrapper.id = 'msg-' + id;
      
      let time = '';
      if (msg.createdAt) {
        try {
          time = new Date(msg.createdAt.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        } catch(e) {}
      }
      
      let bubbleContent = '';
      if (msg.imageUrl) {
        bubbleContent = `
          <div class="message-bubble">
            <img src="${msg.imageUrl}" class="message-image" onclick="window.open('${msg.imageUrl}')" loading="lazy">
            <div class="message-time">${time}</div>
          </div>
        `;
      } else if (msg.audioUrl) {
        const dur = msg.audioDuration || 0;
        bubbleContent = `
          <div class="message-bubble voice-msg" data-audio="${msg.audioUrl}" data-duration="${dur}" onclick="playVoiceMessage(this)">
            <button class="voice-play-btn"><i class="fas fa-play"></i></button>
            <div class="voice-wave-container">${generateWaveBars(18)}</div>
            <span class="voice-duration">0:00 / ${formatDuration(dur)}</span>
            <div class="message-time">${time}</div>
          </div>
        `;
      } else {
        bubbleContent = `
          <div class="message-bubble">
            ${escapeHTML(msg.text || '')}
            <div class="message-time">${time}</div>
          </div>
        `;
      }
      
      wrapper.innerHTML = bubbleContent;
      container.insertBefore(wrapper, tb);
      
      // Mark as seen
      if (!isSent && !msg.seen) {
        setDoc(doc(db, 'chats', chatId, 'messages', id), { seen: true }, { merge: true }).catch(() => {});
      }
    }
    
    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    
    function generateWaveBars(count) {
      let html = '';
      for (let i = 0; i < count; i++) {
        const height = Math.floor(Math.random() * 22) + 4;
        html += `<div class="voice-wave-bar" style="height:${height}px;"></div>`;
      }
      return html;
    }
    
    // ===== PLAY VOICE MESSAGE =====
    window.playVoiceMessage = function(el) {
      const audioUrl = el.getAttribute('data-audio');
      const btn = el.querySelector('.voice-play-btn i');
      const durationEl = el.querySelector('.voice-duration');
      const totalDur = parseFloat(el.getAttribute('data-duration') || 0);
      
      // Stop other playing messages
      document.querySelectorAll('.voice-msg').forEach(m => {
        if (m !== el && m._audio) {
          m._audio.pause();
          const ob = m.querySelector('.voice-play-btn i');
          if (ob) ob.className = 'fas fa-play';
          const od = m.querySelector('.voice-duration');
          if (od && m._totalDur) od.textContent = '0:00 / ' + formatDuration(m._totalDur);
        }
      });
      
      if (!el._audio) {
        el._audio = new Audio(audioUrl);
        el._totalDur = totalDur;
        if (durationEl) durationEl.textContent = '0:00 / ' + formatDuration(totalDur);
        
        el._audio.ontimeupdate = () => {
          if (durationEl && el._audio && el._totalDur) {
            durationEl.textContent = formatDuration(el._audio.currentTime) + ' / ' + formatDuration(el._totalDur);
          }
        };
        el._audio.onended = () => {
          btn.className = 'fas fa-play';
          if (durationEl && el._totalDur) durationEl.textContent = '0:00 / ' + formatDuration(el._totalDur);
        };
      }
      
      const audio = el._audio;
      if (audio.paused) {
        audio.play().catch(() => {});
        btn.className = 'fas fa-pause';
      } else {
        audio.pause();
        btn.className = 'fas fa-play';
        if (durationEl && el._totalDur) {
          durationEl.textContent = formatDuration(audio.currentTime) + ' / ' + formatDuration(el._totalDur);
        }
      }
    };

    // ===== VOICE RECORDING =====
    window.toggleVoice = function() {
      if (isRecording) {
        sendVoice();
      } else {
        startVoice();
      }
    };
    
    async function startVoice() {
      if (!chatId) {
        showToast('Open a chat first');
        return;
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        const options = { audioBitsPerSecond: 128000 };
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          options.mimeType = 'audio/webm;codecs=opus';
        } else {
          options.mimeType = 'audio/webm';
        }
        
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start(100);
        isRecording = true;
        voiceSeconds = 0;
        document.getElementById('recordingBar').classList.add('show');
        document.getElementById('micBtn').style.display = 'none';
        document.getElementById('sendBtn').style.display = 'none';
        document.getElementById('chatInput').style.display = 'none';
        document.getElementById('recTime').textContent = '00:00';
        
        voiceTimer = setInterval(() => {
          voiceSeconds++;
          document.getElementById('recTime').textContent = formatDuration(voiceSeconds);
        }, 1000);
        
      } catch(e) {
        console.error('Voice recording error:', e);
        showToast('Microphone access required');
      }
    }
    
    window.cancelVoice = function() {
      if (mediaRecorder && isRecording) {
        if (mediaRecorder.state === 'recording') mediaRecorder.stop();
        audioChunks = [];
        isRecording = false;
        clearInterval(voiceTimer);
        document.getElementById('recordingBar').classList.remove('show');
        document.getElementById('micBtn').style.display = 'flex';
        document.getElementById('sendBtn').style.display = 'flex';
        document.getElementById('chatInput').style.display = 'block';
      }
    };
    
    window.sendVoice = function() {
      if (!mediaRecorder || !isRecording) return;
      if (voiceSeconds < 1) {
        cancelVoice();
        return;
      }
      
      mediaRecorder.onstop = async () => {
        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        const blob = new Blob(audioChunks, { type: mimeType });
        const reader = new FileReader();
        reader.onload = async function(e) {
          try {
            await ensureChatDoc();
            await addDoc(collection(db, 'chats', chatId, 'messages'), {
              audioUrl: e.target.result,
              audioDuration: voiceSeconds,
              audioMime: mimeType,
              sender: currentUserId,
              createdAt: serverTimestamp(),
              seen: false
            });
            await updateDoc(doc(db, 'chats', chatId), {
              lastMessage: '🎤 Voice message',
              lastTime: serverTimestamp(),
              [`unread_${chatPartner.replace('@', '')}`]: increment(1)
            });
            showToast('Voice message sent');
          } catch(err) {
            console.error('Voice send error:', err);
            showToast('Failed to send voice message');
          }
        };
        reader.readAsDataURL(blob);
      };
      
      mediaRecorder.stop();
      isRecording = false;
      clearInterval(voiceTimer);
      document.getElementById('recordingBar').classList.remove('show');
      document.getElementById('micBtn').style.display = 'flex';
      document.getElementById('sendBtn').style.display = 'flex';
      document.getElementById('chatInput').style.display = 'block';
    };

    // ===== CALL FUNCTIONS =====
    window.startCall = async function(type) {
      if (!chatPartner) {
        showToast('Please select a chat first');
        return;
      }
      
      if (!canChatWithUser(chatPartner)) {
        showToast('❌ You need to be connected to call.');
        return;
      }
      
      if (isCallActive) {
        showToast('Call already in progress');
        return;
      }
      
      callType = type;
      isCallActive = true;
      
      try {
        const constraints = {
          audio: true,
          video: type === 'video'
        };
        
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        
        const overlay = document.getElementById('callOverlay');
        const avatar = document.getElementById('callAvatar');
        const name = document.getElementById('callName');
        const status = document.getElementById('callStatus');
        
        avatar.innerHTML = getAvatarHTML(chatPartner);
        name.textContent = cleanUsername(chatPartner);
        status.textContent = type === 'audio' ? 'Audio calling...' : 'Video calling...';
        
        overlay.classList.add('show');
        document.getElementById('floatingNav').style.display = 'none';
        
        setTimeout(() => {
          if (isCallActive) {
            status.textContent = 'Connected';
            startCallTimer();
          }
        }, 2000);
        
        document.getElementById('audioCallBtn').classList.add('in-call');
        document.getElementById('videoCallBtn').classList.add('in-call');
        
        showToast(`${type} call started`);
        
      } catch (error) {
        console.error('Call error:', error);
        isCallActive = false;
        showToast(`Failed to start ${type} call: ${error.message}`);
        endCall();
      }
    };
    
    function startCallTimer() {
      callSeconds = 0;
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('callTimer').textContent = `${mins}:${secs}`;
      }, 1000);
    }
    
    window.endCall = function() {
      isCallActive = false;
      clearInterval(callTimerInterval);
      callSeconds = 0;
      document.getElementById('callTimer').textContent = '00:00';
      document.getElementById('callOverlay').classList.remove('show');
      document.getElementById('floatingNav').style.display = 'flex';
      
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      
      document.getElementById('audioCallBtn').classList.remove('in-call');
      document.getElementById('videoCallBtn').classList.remove('in-call');
      
      const muteBtn = document.getElementById('muteBtn');
      muteBtn.classList.remove('muted');

    // ===== LOAD USERS =====
    async function loadUsers() {
      if (activePanelTab !== 'users') return;
      if (isLoadingUsers || allUsersLoaded) return;
      
      isLoadingUsers = true;
      const container = document.getElementById('newChatPanelList');
      container.innerHTML = '<div class="panel-loading"><i class="fas fa-spinner"></i> Loading users...</div>';
      
      try {
        let q;
        if (lastVisible) {
          q = query(collection(db, 'users'), orderBy('createdAt', 'desc'), startAfter(lastVisible), limit(PAGE_SIZE));
        } else {
          q = query(collection(db, 'users'), orderBy('createdAt', 'desc'), limit(PAGE_SIZE));
        }
        
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
          allUsersLoaded = true;
          if (allUsers.length === 0) {
            container.innerHTML = '<div class="new-chat-panel-empty"><i class="fas fa-user-slash"></i><p>No users found</p></div>';
          } else {
            renderPanelList();
          }
          isLoadingUsers = false;
          return;
        }
        
        const newUsers = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.username && data.username !== currentUser.displayName) {
            newUsers.push({
              id: doc.id,
              username: data.username,
              name: data.name || cleanUsername(data.username),
              avatar: data.avatar
            });
          }
        });
        
        if (newUsers.length === 0) {
          allUsersLoaded = true;
          if (allUsers.length === 0) {
            container.innerHTML = '<div class="new-chat-panel-empty"><i class="fas fa-user-slash"></i><p>No users found</p></div>';
          } else {
            renderPanelList();
          }
          isLoadingUsers = false;
          return;
        }
        
        lastVisible = snapshot.docs[snapshot.docs.length - 1];
        allUsers = [...allUsers, ...newUsers];
        
        if (newUsers.length < PAGE_SIZE) {
          allUsersLoaded = true;
        }
        
        await loadRequests();
        renderPanelList();
        
      } catch (error) {
        console.error('Error loading users:', error);
        container.innerHTML = '<div class="new-chat-panel-empty"><i class="fas fa-exclamation-triangle"></i><p>Error loading users</p></div>';
      } finally {
        isLoadingUsers = false;
      }
    }
    
    // ===== LOAD REQUESTS =====
    async function loadRequests() {
      pendingRequests = [];
      sentRequests = [];
      acceptedUsers = [];
      
      try {
        // Get pending requests received by current user (incoming)
        const q1 = query(collection(db, 'message_requests'), where('toId', '==', currentUserId), where('status', '==', 'pending'));
        const snapshot1 = await getDocs(q1);
        snapshot1.forEach(doc => {
          const data = doc.data();
          pendingRequests.push({
            id: doc.id,
            from: data.from,
            fromName: data.fromName,
            fromAvatar: data.fromAvatar,
            fromId: data.fromId,
            toId: data.toId
          });
        });
        
        // Get sent requests (outgoing)
        const q2 = query(collection(db, 'message_requests'), where('fromId', '==', currentUserId), where('status', '==', 'pending'));
        const snapshot2 = await getDocs(q2);
        snapshot2.forEach(doc => {
          const data = doc.data();
          sentRequests.push({
            id: doc.id,
            to: data.to,
            toName: data.toName,
            toId: data.toId
          });
        });
        
        // Get accepted users from chats
        const chatsQuery = query(collection(db, 'chats'), where('users', 'array-contains', currentUserId));
        const chatsSnap = await getDocs(chatsQuery);
        chatsSnap.forEach(doc => {
          const data = doc.data();
          if (data.users && data.users.length === 2) {
            const otherUser = data.users.find(u => u !== currentUserId);
            if (otherUser) {
              acceptedUsers.push(otherUser);
            }
          }
        });
        
        const badge = document.getElementById('fabBadge');
        const panelBadge = document.getElementById('panelRequestBadge');
        if (pendingRequests.length > 0) {
          badge.style.display = 'flex';
          badge.textContent = pendingRequests.length;
          panelBadge.style.display = 'inline';
          panelBadge.textContent = pendingRequests.length;
        } else {
          badge.style.display = 'none';
          panelBadge.style.display = 'none';
        }
        
      } catch (error) {
        console.error('Error loading requests:', error);
      }
    }
    
    function hasSentRequest(username) {
      return sentRequests.some(r => r.to === username || r.toId === username.replace('@', ''));
    }
    
    function isAcceptedUser(username) {
      const partnerId = username.replace('@', '');
      return acceptedUsers.some(u => u === partnerId || u === username);
    }
    
    function hasPendingRequestFrom(username) {
      return pendingRequests.some(r => r.from === username);
    }
    
    // ===== RENDER PANEL LIST =====
    function renderPanelList() {
      const container = document.getElementById('newChatPanelList');
      const searchTerm = document.getElementById('panelSearchInput').value.toLowerCase();
      
      if (activePanelTab === 'users') {
        let filtered = allUsers;
        if (searchTerm) {
          filtered = allUsers.filter(u => 
            u.username.toLowerCase().includes(searchTerm) || 
            (u.name || '').toLowerCase().includes(searchTerm)
          );
        }
        
        if (filtered.length === 0) {
          if (allUsers.length === 0 && !isLoadingUsers) {
            container.innerHTML = '<div class="new-chat-panel-empty"><i class="fas fa-user-slash"></i><p>No users found</p></div>';
          } else {
            container.innerHTML = '<div class="new-chat-panel-empty"><i class="fas fa-search"></i><p>No users match your search</p></div>';
          }
          return;
        }
        
        let html = filtered.map(u => {
          const hasRequest = hasSentRequest(u.username);
          const isRequestPending = hasPendingRequestFrom(u.username);
          const isAccepted = isAcceptedUser(u.username);
          
          let actionHtml = '';
          if (isAccepted) {
            actionHtml = `<button class="new-chat-panel-action chat-btn" onclick="event.stopPropagation();openChat('${u.username}')">
              <i class="fas fa-comment"></i> Chat
            </button>`;
          } else if (hasRequest) {
            actionHtml = `<span class="new-chat-panel-action request-sent"><i class="fas fa-clock"></i> Requested</span>`;
          } else if (isRequestPending) {
            const req = pendingRequests.find(r => r.from === u.username);
            actionHtml = `
              <button class="new-chat-panel-action accept" onclick="event.stopPropagation();acceptRequest('${req.id}', '${u.username}')">
                <i class="fas fa-check"></i> Accept
              </button>
              <button class="new-chat-panel-action decline" onclick="event.stopPropagation();declineRequest('${req.id}')">
                <i class="fas fa-times"></i> Decline
              </button>
            `;
          } else {
            actionHtml = `<button class="new-chat-panel-action request-btn" onclick="event.stopPropagation();sendRequest('${u.username}')">
              <i class="fas fa-paper-plane"></i> Request
            </button>`;
          }
          
          return `
            <div class="new-chat-panel-item">
              <div class="new-chat-panel-avatar" onclick="window.location.href='profile.html?user=${encodeURIComponent(u.username)}'">
                ${u.avatar ? `<img src="${u.avatar}">` : '<i class="fas fa-user"></i>'}
              </div>
              <div class="new-chat-panel-info" onclick="window.location.href='profile.html?user=${encodeURIComponent(u.username)}'">
                <div class="new-chat-panel-name">${u.name || cleanUsername(u.username)}</div>
                <div class="new-chat-panel-sub">${u.username}</div>
              </div>
              <div style="display:flex;gap:0.3rem;flex-wrap:wrap;justify-content:flex-end;">
                ${actionHtml}
              </div>
            </div>
          `;
        }).join('');
        
        if (!allUsersLoaded && !isLoadingUsers) {
          html += `<div class="panel-loading" id="panelLoadMore"><i class="fas fa-spinner"></i> Loading more users...</div>`;
        } else if (isLoadingUsers && allUsers.length === 0) {
          html = '<div class="panel-loading"><i class="fas fa-spinner"></i> Loading users...</div>';
        }
        
        container.innerHTML = html;
        
      } else {
        // Requests tab
        if (pendingRequests.length === 0) {
          container.innerHTML = '<div class="new-chat-panel-empty"><i class="fas fa-envelope-open"></i><p>No pending requests</p></div>';
          return;
        }
        
        container.innerHTML = pendingRequests.map(r => `
          <div class="new-chat-panel-item">
            <div class="new-chat-panel-avatar" onclick="window.location.href='profile.html?user=${encodeURIComponent(r.from)}'">
              ${r.fromAvatar ? `<img src="${r.fromAvatar}">` : '<i class="fas fa-user"></i>'}
            </div>
            <div class="new-chat-panel-info" onclick="window.location.href='profile.html?user=${encodeURIComponent(r.from)}'">
              <div class="new-chat-panel-name">${r.fromName || cleanUsername(r.from)}</div>
              <div class="new-chat-panel-sub">${r.from}</div>
            </div>
            <div style="display:flex;gap:0.3rem;">
              <button class="new-chat-panel-action accept" onclick="event.stopPropagation();acceptRequest('${r.id}', '${r.from}')">
                <i class="fas fa-check"></i> Accept
              </button>
              <button class="new-chat-panel-action decline" onclick="event.stopPropagation();declineRequest('${r.id}')">
                <i class="fas fa-times"></i> Decline
              </button>
            </div>
          </div>
        `).join('');
      }
    }
    
    // ===== REQUEST ACTIONS =====
    window.sendRequest = async function(username) {
      try {
        const profile = { name: currentUser.displayName || cleanUsername(currentUser.username), avatar: null };
        
        const requestData = {
          from: currentUser.displayName || currentUser.username,
          fromName: profile.name || cleanUsername(currentUser.username),
          fromAvatar: profile.avatar || null,
          fromId: currentUserId,
          to: username,
          toId: username.replace('@', ''),
          status: 'pending',
          createdAt: serverTimestamp()
        };
        
        const docRef = await addDoc(collection(db, 'message_requests'), requestData);
        
        sentRequests.push({
          id: docRef.id,
          to: username,
          toId: username.replace('@', '')
        });
        
        await loadRequests();
        renderPanelList();
        showToast(`✅ Request sent to ${cleanUsername(username)}`);
        
      } catch(e) {
        console.error('Error sending request:', e);
        showToast('Failed to send request');
      }
    };
    
    window.acceptRequest = async function(requestId, fromUser) {
      try {
        await deleteDoc(doc(db, 'message_requests', requestId));
        
        pendingRequests = pendingRequests.filter(r => r.id !== requestId);
        
        const partnerId = fromUser.replace('@', '');
        const chatId = [currentUserId, partnerId].sort().join('_');
        
        const chatRef = doc(db, 'chats', chatId);
        const chatSnap = await getDoc(chatRef);
        
        if (!chatSnap.exists()) {
          await setDoc(chatRef, {
            users: [currentUserId, partnerId],
            lastMessage: 'Chat started',
            lastTime: serverTimestamp(),
            [`unread_${partnerId}`]: 1,
            [`unread_${currentUserId}`]: 0
          });
        }
        
        if (!acceptedUsers.includes(partnerId)) {
          acceptedUsers.push(partnerId);
        }
        
        await loadRequests();
        renderPanelList();
        
        showToast(`✅ Request accepted from ${cleanUsername(fromUser)}`);
        
        closeNewChatPanel();
        await openChat(fromUser);
        
      } catch(e) {
        console.error('Error accepting request:', e);
        showToast('Failed to accept request');
      }
    };
    
    window.declineRequest = async function(requestId) {
      try {
        await deleteDoc(doc(db, 'message_requests', requestId));
        pendingRequests = pendingRequests.filter(r => r.id !== requestId);
        await loadRequests();
        renderPanelList();
        showToast('Request declined');
      } catch(e) {
        showToast('Failed to decline request');
      }
    };
    
    // ===== CHAT SETTINGS =====
    window.openChatSettings = function() {
      if (!chatPartner) {
        showToast('No chat selected');
        return;
      }
      document.getElementById('chatSettingsOverlay').classList.add('show');
    };
    
    window.closeChatSettings = function() {
      document.getElementById('chatSettingsOverlay').classList.remove('show');
    };
    
    window.viewContact = function() {
      closeChatSettings();
      if (chatPartner) {
        window.location.href = `profile.html?user=${encodeURIComponent(chatPartner)}`;
      }
    };
    
    window.toggleMute = function() {
      isMuted = !isMuted;
      const muteText = document.getElementById('muteText');
      if (isMuted) {
        muteText.textContent = 'Unmute Notifications';
        showToast('Chat muted 🔕');
      } else {
        muteText.textContent = 'Mute Notifications';
        showToast('Chat unmuted 🔔');
      }
    };
    
    window.clearChat = function() {
      if (confirm('Clear all messages in this chat?')) {
        closeChatSettings();
        showToast('Chat cleared');
      }
    };
    
    window.blockUser = function() {
      if (confirm('Block this user?')) {
        closeChatSettings();
        showToast('User blocked 🚫');
        goBack();
      }
    };
    
    window.deleteChat = function() {
      if (confirm('Delete this chat permanently?')) {
        closeChatSettings();
        showToast('Chat deleted');
        goBack();
      }
    };
    
    // ===== EVENT LISTENERS =====
    document.getElementById('chatSettingsOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('chatSettingsOverlay')) closeChatSettings();
    });
    
    document.addEventListener('click', function(e) {
      const panel = document.getElementById('newChatPanel');
      const fab = document.getElementById('fabMain');
      if (isPanelOpen && !panel.contains(e.target) && !fab.contains(e.target)) {
        closeNewChatPanel();
      }
    });
    
    // ===== INIT =====
    console.log('✅ Chat app initialized with full messaging system');
  </script>
</body>
</html>
